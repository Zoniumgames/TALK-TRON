name: Build TALK-TRON
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
          - os: macos-15
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Upload VST3 and standalone
        uses: actions/upload-artifact@v4
        with:
          name: TALK-TRON-${{ matrix.name }}
          path: |
            build/TalkTron_artefacts/Release/VST3/**
            build/TalkTron_artefacts/Release/Standalone/**
            build/TalkTron_artefacts/VST3/**
            build/TalkTron_artefacts/Standalone/**
          if-no-files-found: error
